name: Xiuxian iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: xiuxian-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.1
      - name: Toolchain
        run: |
          flutter --version
          xcodebuild -version
          flutter doctor -v
      - name: Dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Tests
        run: flutter test --no-pub
      - name: Build unsigned device app
        run: flutter build ios --release --no-codesign --no-pub
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p build/ios/package/Payload
          ditto build/ios/iphoneos/Runner.app build/ios/package/Payload/Runner.app
          cd build/ios/package
          ditto -c -k --keepParent Payload ../xiuxian-unsigned.ipa
      - name: Build simulator app
        run: flutter build ios --simulator --debug --no-pub
      - name: Package simulator app
        run: ditto -c -k --keepParent build/ios/iphonesimulator/Runner.app build/ios/xiuxian-simulator.zip
      - name: Upload iOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: xiuxian-ios-${{ github.sha }}
          path: |
            build/ios/xiuxian-unsigned.ipa
            build/ios/xiuxian-simulator.zip
          if-no-files-found: error
          retention-days: 14
